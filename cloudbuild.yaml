steps:
  # Execute SonarCloud Scan with Git pre-installed
  - name: 'maven:3-openjdk-18-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        apt-get update && apt-get install -y git
        mvn verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -e -X \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.organization=ameerhossam \
          -Dsonar.projectKey=DevSecOps-Pipeline-using-GCP-services \
          -Dsonar.token=${_SONAR_TOKEN}
  - name: 'ubuntu'
    entrypoint: bash
    args: 
        - '-c'
        - |-
          apt-get update
          apt-get -y install maven 
          SNYK_TOKEN=${_SNYK_TOKEN}
          export SNYK_TOKEN
          mvn snyk:test -fn 
    id: Snyk SCA

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _SONAR_TOKEN: '' 
